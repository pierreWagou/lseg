[project]
name = "lseg-extractor"
version = "0.1.0"
description = "Extract market, reference and news data from the LSEG Data Platform (lseg-data) via reusable Python primitives and a thin CLI."
readme = "README.md"
authors = [
    { name = "Pierre Romon", email = "pierre.romon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lseg-data>=2,<3",
    "pandas>=2",
    "pyarrow>=15",
    "typer>=0.12",
    "python-dotenv>=1",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.scripts]
lseg-extract = "lseg_extractor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
